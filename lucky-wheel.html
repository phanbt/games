<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Lucky Wheel</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<style>
  /* Layout: setup screen to enter names; play screen with the wheel on the left and the winners column on the right. */
  :root {
    --bg: #F1ECE4;
    --surface: #FFFFFF;
    --frame: #E7DFD3;
    --ink: #1E1B2E;
    --muted: #6A6478;
    --line: #D4CBBE;
    --accent: #F2B705;
    --brand: #D7263D;
    --on-brand: #FFFFFF;
    --win: #FFE27A;
    --on-win: #1E1B2E;
    --ok: #1B8F60;
    --display: "Baloo 2", "Trebuchet MS", "Segoe UI", sans-serif;
    --body: "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14121D; --surface: #1F1C2C; --frame: #2A2639; --ink: #F3EFF8; --muted: #A59FB4;
      --line: #3A3550; --accent: #F5C433; --brand: #EF4A5F; --on-brand: #FFFFFF;
      --win: #F5C433; --on-win: #14121D; --ok: #35B37E; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14121D; --surface: #1F1C2C; --frame: #2A2639; --ink: #F3EFF8; --muted: #A59FB4;
    --line: #3A3550; --accent: #F5C433; --brand: #EF4A5F; --on-brand: #FFFFFF;
    --win: #F5C433; --on-win: #14121D; --ok: #35B37E; color-scheme: dark;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.5;
    padding-inline: max(16px, env(safe-area-inset-left, 0px), env(safe-area-inset-right, 0px));
    padding-block: 24px 48px;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }
  .app { max-width: 1120px; margin-inline: auto; display: flex; flex-direction: column; gap: 24px; }
  h1 {
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(2rem, 7vw, 2.75rem);
    line-height: 1.1;
    margin: 0;
  }
  h1 span { color: var(--brand); }
  h2 { font-family: var(--display); font-weight: 700; font-size: 1.5rem; line-height: 1.2; margin: 0; }
  .lede { margin: 4px 0 0; color: var(--muted); }

  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    font-family: var(--display); font-weight: 600; font-size: 1.0625rem; line-height: 1;
    padding: 12px 18px 10px;
    background: var(--surface);
    border: 2px solid var(--ink);
    border-radius: 12px;
    box-shadow: 0 3px 0 var(--ink);
    transition: transform .08s, box-shadow .08s;
    white-space: nowrap;
  }
  .btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.primary { background: var(--brand); color: var(--on-brand); }
  .btn.small { font-size: .9375rem; padding: 8px 12px 6px; border-radius: 10px; }

  .card {
    background: var(--surface);
    border: 2px solid var(--ink);
    border-radius: 18px;
    padding: 20px;
  }

  /* Setup */
  .setup { max-width: 640px; width: 100%; margin-inline: auto; display: flex; flex-direction: column; gap: 16px; }
  .setup label { font-weight: 600; }
  textarea {
    width: 100%;
    min-height: 260px;
    resize: vertical;
    padding: 12px 14px;
    border: 2px solid var(--line);
    border-radius: 12px;
    background: var(--bg);
    line-height: 1.6;
  }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .row.spread { justify-content: space-between; }
  .count { color: var(--muted); font-size: .9375rem; }
  .numfill { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: var(--muted); font-size: .9375rem; }
  .numfill input {
    width: 84px; padding: 6px 10px; border: 2px solid var(--line); border-radius: 10px; background: var(--bg);
  }

  /* Play */
  .topbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 16px; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; }
  .play { display: grid; grid-template-columns: minmax(0, 1fr) minmax(260px, 340px); gap: 24px; align-items: start; }
  @media (max-width: 820px) { .play { grid-template-columns: minmax(0, 1fr); } }

  .stage { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .wheel-wrap {
    position: relative;
    width: min(100%, 620px, calc(100vh - 200px));
    min-width: 260px;
    aspect-ratio: 1;
  }
  @media (max-width: 820px) { .wheel-wrap { width: min(100%, 560px); min-width: 0; } }
  #wheel { width: 100%; height: 100%; display: block; }
  .wheel-wrap.over #wheel { opacity: .45; filter: grayscale(.6); }
  .pointer {
    position: absolute; left: 50%; top: -6px;
    width: 0; height: 0;
    transform: translateX(-50%);
    border-left: 18px solid transparent;
    border-right: 18px solid transparent;
    border-top: 36px solid var(--brand);
    filter: drop-shadow(0 2px 0 var(--ink));
    z-index: 2;
  }
  .hub {
    position: absolute; left: 50%; top: 50%;
    width: 22%; aspect-ratio: 1;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    border: 4px solid var(--ink);
    background: var(--brand);
    color: var(--on-brand);
    font-family: var(--display); font-weight: 700;
    font-size: clamp(1rem, 4.2vw, 1.75rem);
    letter-spacing: .04em;
    line-height: 1;
    padding-top: .15em;
    box-shadow: 0 4px 0 var(--ink), 0 0 0 6px var(--surface);
    transition: transform .1s, box-shadow .1s;
    z-index: 2;
  }
  .hub:active:not(:disabled) { transform: translate(-50%, calc(-50% + 3px)); box-shadow: 0 1px 0 var(--ink), 0 0 0 6px var(--surface); }
  .hub:disabled { cursor: not-allowed; }
  .hub:focus-visible { outline: 4px solid var(--accent); outline-offset: 6px; }
  .stage-note { margin: 0; color: var(--muted); text-align: center; min-height: 1.5em; }

  .winners { display: flex; flex-direction: column; gap: 14px; }
  .winners.over { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent); }
  .winners-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .winners-head span { color: var(--muted); font-size: .9375rem; }
  .gameover {
    margin: 0;
    padding: 8px 12px;
    border-radius: 10px;
    background: var(--ink);
    color: var(--bg);
    font-family: var(--display); font-weight: 600; text-align: center;
  }
  #winner-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; max-height: 60vh; overflow-y: auto; }
  #winner-list li {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px 8px;
    border-radius: 12px;
    background: var(--win);
    color: var(--on-win);
    border: 2px solid var(--ink);
    font-family: var(--display); font-weight: 700; font-size: 1.25rem; line-height: 1.2;
    overflow-wrap: anywhere;
  }
  #winner-list li b {
    flex: none;
    width: 32px; height: 32px;
    display: grid; place-items: center;
    border-radius: 50%;
    background: var(--ink); color: var(--bg);
    font-size: 1rem;
    padding-top: .1em;
  }
  #winner-list li.fresh { animation: arrive .7s cubic-bezier(.2, 1.4, .4, 1); }
  @keyframes arrive { from { transform: translateX(-40px) scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }
  .empty { margin: 0; color: var(--muted); }

  /* Dialogs */
  dialog {
    border: 2px solid var(--ink);
    border-radius: 20px;
    padding: 28px 24px 24px;
    background: var(--surface);
    color: var(--ink);
    width: min(520px, calc(100vw - 32px));
    text-align: center;
    box-shadow: 0 8px 0 var(--ink);
  }
  dialog::backdrop { background: rgb(0 0 0 / .55); }
  dialog[open] { animation: pop .35s cubic-bezier(.2, 1.4, .4, 1); }
  @keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: none; opacity: 1; } }
  .kicker { margin: 0; font-size: .8125rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .big-name {
    margin: 12px 0 20px;
    padding: 14px 16px 10px;
    border-radius: 14px;
    background: var(--win);
    color: var(--on-win);
    font-family: var(--display); font-weight: 700;
    font-size: clamp(2rem, 9vw, 3.5rem); line-height: 1.1;
    overflow-wrap: anywhere;
  }
  .final-list { list-style: none; margin: 16px 0 20px; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-height: 50vh; overflow-y: auto; }
  .final-list li {
    padding: 8px 14px 6px; border-radius: 999px;
    background: var(--win); color: var(--on-win); border: 2px solid var(--ink);
    font-family: var(--display); font-weight: 700; font-size: 1.125rem; line-height: 1.2;
  }
  .final-list li small { font-size: .8125rem; opacity: .7; margin-right: 6px; }
  dialog .row { justify-content: center; }
  dialog p.msg { margin: 8px 0 20px; color: var(--muted); }

  #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2147483647; }
</style>
</head>
<body>
<div class="app">

  <!-- Setup screen -->
  <section id="setup" class="setup">
    <header>
      <div class="row spread">
        <h1>Lucky <span>Wheel</span></h1>
        <button class="btn small theme-toggle" type="button"></button>
      </div>
      <p class="lede">Enter the names, items or numbers to draw from &mdash; one per line.</p>
    </header>
    <div class="card" style="display:flex;flex-direction:column;gap:12px">
      <div class="row spread">
        <label for="entries">Entries</label>
        <span class="count" id="entry-count">0 entries</span>
      </div>
      <textarea id="entries" spellcheck="false" placeholder="Alice&#10;Bob&#10;Charlie&#10;Prize #1&#10;42"></textarea>
      <div class="row spread">
        <div class="numfill">
          Add numbers from
          <input id="num-from" type="number" inputmode="numeric" value="1" aria-label="From">
          to
          <input id="num-to" type="number" inputmode="numeric" value="20" aria-label="To">
          <button class="btn small" id="num-add" type="button">Add</button>
        </div>
        <div class="row">
          <button class="btn small" id="shuffle" type="button">Shuffle</button>
          <button class="btn small" id="clear" type="button">Clear</button>
        </div>
      </div>
    </div>
    <div class="row" style="justify-content:flex-end">
      <button class="btn primary" id="start" type="button" disabled>Start game</button>
    </div>
  </section>

  <!-- Play screen -->
  <section id="game" hidden>
    <div class="topbar">
      <h1>Lucky <span>Wheel</span></h1>
      <div class="controls">
        <button class="btn" id="stop" type="button">■ Stop game</button>
        <button class="btn" id="replay" type="button">↻ Replay</button>
        <button class="btn" id="reset" type="button">⟲ Reset</button>
        <button class="btn small" id="sound" type="button" aria-pressed="true" title="Sound on/off">🔊</button>
        <button class="btn small theme-toggle" type="button"></button>
      </div>
    </div>
    <div class="play" style="margin-top:24px">
      <div class="stage">
        <div class="wheel-wrap" id="wheel-wrap">
          <div class="pointer" aria-hidden="true"></div>
          <canvas id="wheel" role="img" aria-label="Lucky wheel"></canvas>
          <button class="hub" id="spin" type="button">SPIN</button>
        </div>
        <p class="stage-note" id="stage-note" aria-live="polite"></p>
      </div>
      <aside class="card winners" id="winners-card">
        <div class="winners-head">
          <h2>🏆 Winners</h2>
          <span id="winner-count"></span>
        </div>
        <p class="gameover" id="gameover" hidden>Game over</p>
        <ol id="winner-list"></ol>
        <p class="empty" id="no-winners">No winners yet. Spin the wheel!</p>
      </aside>
    </div>
  </section>
</div>

<dialog id="win-dialog">
  <p class="kicker">🎉 We have a winner! 🎉</p>
  <div class="big-name" id="win-name"></div>
  <form method="dialog" class="row">
    <button class="btn primary" value="ok" autofocus>Continue</button>
  </form>
</dialog>

<dialog id="final-dialog">
  <p class="kicker">Game over</p>
  <h2 id="final-title">Winners</h2>
  <ol class="final-list" id="final-list"></ol>
  <form method="dialog" class="row">
    <button class="btn" value="close">Close</button>
    <button class="btn" value="replay">↻ Replay</button>
    <button class="btn primary" value="reset">⟲ Reset</button>
  </form>
</dialog>

<dialog id="confirm-dialog">
  <h2 id="confirm-title"></h2>
  <p class="msg" id="confirm-msg"></p>
  <form method="dialog" class="row">
    <button class="btn" value="no">Cancel</button>
    <button class="btn primary" value="yes" id="confirm-yes">Yes</button>
  </form>
</dialog>

<canvas id="confetti"></canvas>

<script>
(() => {
  const STORE = 'lucky-wheel-v1';
  const COLORS = ['#E63946', '#F4A261', '#E9C46A', '#2A9D8F', '#457B9D', '#8E5CC9', '#EC6FA8', '#5FB04A'];
  const LIGHT_TEXT = new Set(['#E63946', '#2A9D8F', '#457B9D', '#8E5CC9', '#5FB04A']);

  const $ = (id) => document.getElementById(id);
  const el = {
    setup: $('setup'), game: $('game'), entries: $('entries'), entryCount: $('entry-count'),
    numFrom: $('num-from'), numTo: $('num-to'), numAdd: $('num-add'), shuffle: $('shuffle'), clear: $('clear'), start: $('start'),
    stop: $('stop'), replay: $('replay'), reset: $('reset'), sound: $('sound'),
    wrap: $('wheel-wrap'), wheel: $('wheel'), spin: $('spin'), note: $('stage-note'),
    winnersCard: $('winners-card'), winnerList: $('winner-list'), winnerCount: $('winner-count'), noWinners: $('no-winners'), gameover: $('gameover'),
    winDialog: $('win-dialog'), winName: $('win-name'),
    finalDialog: $('final-dialog'), finalTitle: $('final-title'), finalList: $('final-list'),
    confirmDialog: $('confirm-dialog'), confirmTitle: $('confirm-title'), confirmMsg: $('confirm-msg'), confirmYes: $('confirm-yes'),
    confetti: $('confetti'),
  };

  // phase: 'setup' | 'play' | 'over'. remaining/winners hold {id, label} so duplicate labels stay distinct.
  let state = { phase: 'setup', draft: '', entries: [], remaining: [], winners: [], rotation: 0 };
  let spinning = false;
  let pendingWinner = null;
  let soundOn = true;
  let theme = null; // 'light' | 'dark', or null to follow the device setting

  function save() {
    try { localStorage.setItem(STORE, JSON.stringify({ ...state, soundOn, theme })); } catch (e) {}
  }
  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(STORE));
      if (s && Array.isArray(s.entries)) {
        state = { phase: s.phase, draft: s.draft || '', entries: s.entries, remaining: s.remaining || [], winners: s.winners || [], rotation: s.rotation || 0 };
        soundOn = s.soundOn !== false;
        if (s.theme === 'light' || s.theme === 'dark') theme = s.theme;
      }
    } catch (e) {}
  }

  function parseEntries(text) {
    return text.split('\n').map((s) => s.trim()).filter(Boolean);
  }
  function rand() {
    const a = new Uint32Array(1);
    crypto.getRandomValues(a);
    return a[0] / 4294967296;
  }
  function shuffled(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rand() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  /* ---------- Setup ---------- */
  function updateCount() {
    const n = parseEntries(el.entries.value).length;
    el.entryCount.textContent = n === 1 ? '1 entry' : `${n} entries`;
    el.start.disabled = n < 1;
    state.draft = el.entries.value;
    save();
  }
  el.entries.addEventListener('input', updateCount);
  el.numAdd.addEventListener('click', () => {
    let a = parseInt(el.numFrom.value, 10), b = parseInt(el.numTo.value, 10);
    if (!Number.isFinite(a) || !Number.isFinite(b)) return;
    if (a > b) [a, b] = [b, a];
    if (b - a > 999) b = a + 999;
    const nums = [];
    for (let i = a; i <= b; i++) nums.push(String(i));
    const cur = el.entries.value.replace(/\s+$/, '');
    el.entries.value = (cur ? cur + '\n' : '') + nums.join('\n');
    updateCount();
  });
  el.shuffle.addEventListener('click', () => {
    el.entries.value = shuffled(parseEntries(el.entries.value)).join('\n');
    updateCount();
  });
  el.clear.addEventListener('click', () => { el.entries.value = ''; updateCount(); el.entries.focus(); });
  el.start.addEventListener('click', () => {
    const list = parseEntries(el.entries.value);
    if (!list.length) return;
    state.entries = list;
    beginRound();
  });

  function beginRound() {
    state.phase = 'play';
    state.remaining = state.entries.map((label, id) => ({ id, label }));
    state.winners = [];
    state.rotation = 0;
    pendingWinner = null;
    save();
    render();
  }

  /* ---------- Play ---------- */
  function render() {
    const inGame = state.phase !== 'setup';
    el.setup.hidden = inGame;
    el.game.hidden = !inGame;
    if (!inGame) {
      el.entries.value = state.draft;
      updateCount();
      return;
    }
    const over = state.phase === 'over';
    el.spin.disabled = spinning || over || state.remaining.length === 0;
    el.stop.disabled = spinning || over;
    el.replay.disabled = spinning;
    el.reset.disabled = spinning;
    el.wrap.classList.toggle('over', over);
    el.winnersCard.classList.toggle('over', over);
    el.gameover.hidden = !over;
    el.note.textContent = over
      ? 'The game has ended. Press Replay to draw again from the same list.'
      : spinning ? 'Spinning…'
      : `${state.remaining.length} left on the wheel`;
    renderWinners();
    sizeWheel();
  }

  function renderWinners(freshIds = []) {
    el.winnerList.replaceChildren(...state.winners.map((w, i) => {
      const li = document.createElement('li');
      const b = document.createElement('b');
      b.textContent = i + 1;
      li.append(b, document.createTextNode(w.label));
      if (freshIds.includes(w.id)) li.classList.add('fresh');
      return li;
    }));
    el.noWinners.hidden = state.winners.length > 0;
    el.winnerCount.textContent = state.winners.length ? `${state.winners.length} of ${state.entries.length}` : '';
    if (freshIds.length) el.winnerList.lastElementChild?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  /* ---------- Wheel drawing ---------- */
  const ctx = el.wheel.getContext('2d');
  let size = 0;

  function sizeWheel() {
    if (el.game.hidden) return;
    const rect = el.wrap.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    size = rect.width;
    el.wheel.width = Math.round(size * dpr);
    el.wheel.height = Math.round(size * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }
  new ResizeObserver(sizeWheel).observe(el.wrap);

  function segColor(i, n) {
    let c = COLORS[i % COLORS.length];
    // Avoid two neighbouring slices sharing a colour where the wheel wraps around.
    if (n > 1 && i === n - 1 && c === COLORS[0]) c = COLORS[(i + 1) % COLORS.length];
    return c;
  }

  function fitText(text, maxW) {
    if (ctx.measureText(text).width <= maxW) return text;
    let lo = 0, hi = text.length;
    while (lo < hi) {
      const mid = (lo + hi + 1) >> 1;
      if (ctx.measureText(text.slice(0, mid) + '…').width <= maxW) lo = mid; else hi = mid - 1;
    }
    return lo ? text.slice(0, lo) + '…' : '';
  }

  function draw() {
    if (!size) return;
    const css = getComputedStyle(document.documentElement);
    const ink = css.getPropertyValue('--ink').trim();
    const surface = css.getPropertyValue('--surface').trim();
    const c = size / 2, R = c - 4, r = R - 10;
    const hubR = size * 0.11;
    const items = state.remaining;
    const n = items.length;

    ctx.clearRect(0, 0, size, size);
    // Rim
    ctx.beginPath(); ctx.arc(c, c, R, 0, Math.PI * 2); ctx.fillStyle = ink; ctx.fill();

    if (n === 0) {
      ctx.beginPath(); ctx.arc(c, c, r, 0, Math.PI * 2); ctx.fillStyle = surface; ctx.fill();
      return;
    }

    const seg = (Math.PI * 2) / n;
    for (let i = 0; i < n; i++) {
      const a0 = state.rotation + i * seg;
      ctx.beginPath();
      ctx.moveTo(c, c);
      ctx.arc(c, c, r, a0, a0 + seg);
      ctx.closePath();
      ctx.fillStyle = segColor(i, n);
      ctx.fill();
      if (n > 1) { ctx.lineWidth = n > 80 ? 0.5 : 1.5; ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.stroke(); }
    }

    // Labels, written along the radius toward the rim.
    const arcH = seg * (r * 0.62);
    const fs = Math.min(Math.max(arcH * 0.62, 0), size * 0.055, 30);
    if (fs >= 7) {
      ctx.font = `700 ${fs}px "Baloo 2", "Trebuchet MS", sans-serif`;
      ctx.textBaseline = 'middle';
      ctx.textAlign = 'right';
      const maxW = r - hubR - 22;
      for (let i = 0; i < n; i++) {
        const color = segColor(i, n);
        ctx.save();
        ctx.translate(c, c);
        ctx.rotate(state.rotation + i * seg + seg / 2);
        ctx.fillStyle = LIGHT_TEXT.has(color) ? '#FFFFFF' : '#1E1B2E';
        ctx.fillText(fitText(items[i].label, maxW), r - 14, fs * 0.08);
        ctx.restore();
      }
    }

    // Pegs on the rim at each slice boundary.
    if (n <= 72) {
      for (let i = 0; i < n; i++) {
        const a = state.rotation + i * seg;
        ctx.beginPath();
        ctx.arc(c + Math.cos(a) * (R - 5), c + Math.sin(a) * (R - 5), Math.max(2, size * 0.006), 0, Math.PI * 2);
        ctx.fillStyle = '#FFFFFF';
        ctx.fill();
      }
    }
  }

  // Slice under the pointer, which sits at the top (angle -π/2).
  function indexAtPointer(rotation, n) {
    const seg = (Math.PI * 2) / n;
    let a = (-Math.PI / 2 - rotation) % (Math.PI * 2);
    if (a < 0) a += Math.PI * 2;
    return Math.min(n - 1, Math.floor(a / seg));
  }

  /* ---------- Sound ---------- */
  let audio = null;
  function ac() {
    if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (audio && audio.state === 'suspended') audio.resume();
    return audio;
  }
  function tone(freq, start, dur, type = 'triangle', vol = 0.15) {
    const a = ac(); if (!a || !soundOn) return;
    const t = a.currentTime + start;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(a.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  const tick = () => tone(1400, 0, 0.04, 'square', 0.05);
  const fanfare = () => [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.11, 0.35, 'triangle', 0.18));
  function syncSoundBtn() {
    el.sound.textContent = soundOn ? '🔊' : '🔇';
    el.sound.setAttribute('aria-pressed', String(soundOn));
  }
  el.sound.addEventListener('click', () => { soundOn = !soundOn; syncSoundBtn(); save(); });

  /* ---------- Spin ---------- */
  const easeOut = (t) => 1 - Math.pow(1 - t, 4);

  function spin() {
    const n = state.remaining.length;
    if (spinning || state.phase !== 'play' || !n) return;
    ac();
    spinning = true;
    render();

    const seg = (Math.PI * 2) / n;
    const target = Math.floor(rand() * n);
    // Land somewhere inside the target slice, away from its edges.
    const within = (0.15 + 0.7 * rand()) * seg;
    const desired = -Math.PI / 2 - (target * seg + within);
    const full = Math.PI * 2;
    let delta = (desired - state.rotation) % full;
    if (delta < 0) delta += full;
    const turns = 5 + Math.floor(rand() * 4);
    const from = state.rotation;
    const to = from + turns * full + delta;
    const duration = 5200 + rand() * 1800;
    const t0 = performance.now();
    let lastIdx = indexAtPointer(from, n);

    function frame(now) {
      const t = Math.min(1, (now - t0) / duration);
      state.rotation = from + (to - from) * easeOut(t);
      draw();
      const idx = indexAtPointer(state.rotation, n);
      if (idx !== lastIdx) { lastIdx = idx; tick(); }
      if (t < 1) { requestAnimationFrame(frame); return; }
      state.rotation = to % full;
      spinning = false;
      announce(state.remaining[target]);
    }
    requestAnimationFrame(frame);
  }
  el.spin.addEventListener('click', spin);

  function announce(item) {
    pendingWinner = item;
    el.winName.textContent = item.label;
    el.note.textContent = `Winner: ${item.label}`;
    fanfare();
    confetti();
    el.winDialog.showModal();
  }
  // However the announcement closes (button, Esc), the winner moves to the right and leaves the wheel.
  el.winDialog.addEventListener('close', () => {
    const item = pendingWinner;
    if (!item) return;
    pendingWinner = null;
    state.remaining = state.remaining.filter((x) => x.id !== item.id);
    state.winners.push(item);
    const fresh = [item.id];
    // Only one left: no need to spin, it is the last winner.
    if (state.remaining.length === 1) {
      const last = state.remaining.pop();
      state.winners.push(last);
      fresh.push(last.id);
    }
    if (!state.remaining.length) state.phase = 'over';
    save();
    render();
    renderWinners(fresh);
    if (state.phase === 'over') showFinal();
    else el.spin.focus();
  });

  /* ---------- Stop / Replay / Reset ---------- */
  function showFinal() {
    const n = state.winners.length;
    el.finalTitle.textContent = n ? (n === 1 ? '1 winner' : `${n} winners`) : 'No winners drawn';
    el.finalList.replaceChildren(...state.winners.map((w, i) => {
      const li = document.createElement('li');
      const s = document.createElement('small');
      s.textContent = `#${i + 1}`;
      li.append(s, document.createTextNode(w.label));
      return li;
    }));
    if (n) confetti();
    el.finalDialog.showModal();
  }
  el.finalDialog.addEventListener('close', () => {
    if (el.finalDialog.returnValue === 'replay') replay();
    else if (el.finalDialog.returnValue === 'reset') askReset();
    el.finalDialog.returnValue = '';
  });

  function confirm(title, msg, yesLabel) {
    return new Promise((resolve) => {
      el.confirmTitle.textContent = title;
      el.confirmMsg.textContent = msg;
      el.confirmYes.textContent = yesLabel;
      el.confirmDialog.returnValue = '';
      el.confirmDialog.addEventListener('close', () => resolve(el.confirmDialog.returnValue === 'yes'), { once: true });
      el.confirmDialog.showModal();
    });
  }

  el.stop.addEventListener('click', async () => {
    if (spinning || state.phase !== 'play') return;
    if (!(await confirm('Stop the game?', 'No more spins. The winners so far will be shown.', 'Stop game'))) return;
    state.phase = 'over';
    save();
    render();
    showFinal();
  });

  function replay() {
    if (spinning) return;
    beginRound();
    el.spin.focus();
  }
  el.replay.addEventListener('click', async () => {
    if (spinning) return;
    if (state.winners.length && state.phase === 'play' &&
        !(await confirm('Replay from the beginning?', 'All entries go back on the wheel and the winners list is cleared.', 'Replay'))) return;
    replay();
  });

  async function askReset() {
    if (!(await confirm('Reset the game?', 'This clears the wheel and the winners so you can enter a new list.', 'Reset'))) return;
    state = { phase: 'setup', draft: '', entries: [], remaining: [], winners: [], rotation: 0 };
    save();
    render();
    el.entries.focus();
  }
  el.reset.addEventListener('click', () => { if (!spinning) askReset(); });

  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && state.phase === 'play' && !el.game.hidden && !document.querySelector('dialog[open]')
        && document.activeElement?.tagName !== 'BUTTON') {
      e.preventDefault();
      spin();
    }
  });

  /* ---------- Confetti ---------- */
  const cctx = el.confetti.getContext('2d');
  let parts = [], confettiRunning = false;
  function confetti() {
    const w = innerWidth, h = innerHeight;
    el.confetti.width = w; el.confetti.height = h;
    for (let i = 0; i < 160; i++) {
      parts.push({
        x: w / 2 + (rand() - 0.5) * w * 0.3, y: h * 0.35,
        vx: (rand() - 0.5) * 14, vy: -rand() * 14 - 4,
        s: 6 + rand() * 6, r: rand() * Math.PI, vr: (rand() - 0.5) * 0.3,
        c: COLORS[Math.floor(rand() * COLORS.length)], life: 0,
      });
    }
    if (!confettiRunning) { confettiRunning = true; requestAnimationFrame(stepConfetti); }
  }
  function stepConfetti() {
    const h = el.confetti.height;
    cctx.clearRect(0, 0, el.confetti.width, h);
    parts = parts.filter((p) => p.y < h + 20 && p.life < 260);
    for (const p of parts) {
      p.life++; p.vy += 0.35; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      cctx.save(); cctx.translate(p.x, p.y); cctx.rotate(p.r);
      cctx.fillStyle = p.c; cctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
      cctx.restore();
    }
    if (parts.length) requestAnimationFrame(stepConfetti);
    else { confettiRunning = false; cctx.clearRect(0, 0, el.confetti.width, h); }
  }

  // Redraw when the theme flips so the rim matches.
  /* ---------- Night mode ---------- */
  const systemDark = matchMedia('(prefers-color-scheme: dark)');
  const isDark = () => (theme ? theme === 'dark' : systemDark.matches);
  function applyTheme() {
    if (theme) document.documentElement.dataset.theme = theme;
    else delete document.documentElement.dataset.theme;
    const dark = isDark();
    document.querySelectorAll('.theme-toggle').forEach((b) => {
      b.textContent = dark ? '☀️ Day' : '🌙 Night';
      b.title = dark ? 'Switch to day mode' : 'Switch to night mode';
      b.setAttribute('aria-pressed', String(dark));
    });
    draw();
  }
  document.querySelectorAll('.theme-toggle').forEach((b) => b.addEventListener('click', () => {
    theme = isDark() ? 'light' : 'dark';
    applyTheme();
    save();
  }));
  systemDark.addEventListener?.('change', applyTheme);
  document.fonts?.ready.then(draw);

  load();
  syncSoundBtn();
  applyTheme();
  if (state.phase !== 'setup' && !state.entries.length) state.phase = 'setup';
  render();
})();
</script>
</body>
</html>
